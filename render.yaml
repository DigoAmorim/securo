version: "1"

# 1. PostgreSQL Database
databases:
  - name: securo-db
    databaseName: securo
    postgresMajorVersion: "16"
    plan: free

services:
  # 2. Redis Instance
  - type: redis
    name: securo-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # 3. Backend (FastAPI + Celery all-in-one)
  - type: web
    name: securo-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    # Runs the migrations, starts the celery worker in the background (&), and then starts the web server.
    dockerCommand: alembic upgrade head && (celery -A app.worker worker --loglevel=info --concurrency=1 &) && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securo-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOCAL_AUTH_ENABLED
        value: "true"
      - key: TESOURO_DIRETO_ENABLED
        value: "true"
      - key: FX_SYNC_MODE
        value: on_demand
      - key: AGENTS_ENABLED
        value: "false"
      - key: FRONTEND_URL
        sync: false 

  # 4. Frontend Web App
  - type: web
    name: securo-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false
