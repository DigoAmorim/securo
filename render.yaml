version: "1"

# 1. PostgreSQL Database
databases:
  - name: securo-db
    databaseName: securo
    postgresMajorVersion: "16"
    plan: free

services:
  # 2. Redis Instance
  - type: redis
    name: securo-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Empty array means only internal Render services can connect

  # 3. Backend (FastAPI / Uvicorn)
  - type: web
    name: securo-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    dockerCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securo-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOCAL_AUTH_ENABLED
        value: "true"
      - key: TESOURO_DIRETO_ENABLED
        value: "true"
      - key: FX_SYNC_MODE
        value: on_demand
      - key: AGENTS_ENABLED
        value: "false"
      - key: FRONTEND_URL
        sync: false 

  # 4. Frontend Web App
  - type: web
    name: securo-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false # You will fill this in the Render dashboard later

  # 5. Celery Worker
  - type: worker
    name: securo-celery-worker
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter 
    dockerCommand: celery -A app.worker worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securo-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: securo-backend
          envVarKey: SECRET_KEY

  # 6. Celery Beat
  - type: worker
    name: securo-celery-beat
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    dockerCommand: celery -A app.worker beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securo-redis
          property: connectionString
